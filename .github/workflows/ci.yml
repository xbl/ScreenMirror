name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck & Test (macOS)
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SCREENMIRROR_USE_IOSURFACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure Swift linker path
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_lib_dir="$(dirname "$swiftc_path")/../lib/swift/macosx"
          echo "RUSTFLAGS=-L $swift_lib_dir" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix viewer

      - name: Frontend Lint (Host & Viewer)
        run: |
          npm run lint
          (cd viewer && npm run lint)

      - name: TypeScript Typecheck (Host & Viewer)
        run: |
          npx vue-tsc --noEmit
          (cd viewer && npx vue-tsc --noEmit -p tsconfig.json)

      - name: Frontend Unit Tests (Vitest)
        run: npm test

      - name: Build Viewer SPA
        run: npm run build --prefix viewer

      - name: Rust Backend Check & Tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --release
          cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
