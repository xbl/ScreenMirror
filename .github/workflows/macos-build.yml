name: macOS Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SCREENMIRROR_USE_IOSURFACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install host dependencies
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci --prefix viewer

      - name: Set release version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/set-release-version.mjs "${RELEASE_TAG#v}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Configure Swift linker path
        run: |
          swiftc_path="$(xcrun --find swiftc)"
          swift_lib_dir="$(dirname "$swiftc_path")/../lib/swift/macosx"
          echo "RUSTFLAGS=-L $swift_lib_dir" >> "$GITHUB_ENV"

      - name: Check host and viewer
        run: |
          npm run build
          npm run build --prefix viewer

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features screenkit

      - name: Build unsigned macOS bundles
        run: npx tauri build --target aarch64-apple-darwin --features screenkit

      - name: Sign app bundle for Gatekeeper compatibility
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ScreenMirror.app"
          codesign --force --deep --verbose --sign - --timestamp=none "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          rm -f src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          version="${RELEASE_TAG#v}"
          hdiutil create \
            -volname "ScreenMirror ${version}" \
            -srcfolder "$app_path" \
            -ov -format UDZO \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/ScreenMirror_${version}_aarch64.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "ScreenMirror-${RELEASE_TAG}-aarch64.app.zip"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: screenmirror-macos-aarch64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ScreenMirror-${{ github.ref_name }}-aarch64.app.zip
