<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Screenmirror Icon Generator</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: transparent;
    }
    .stage {
      display: block;
    }
  </style>
</head>
<body>
  <svg id="icon" class="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
      <!-- Deep night-sky background. -->
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#0b1d3a"/>
        <stop offset="0.55" stop-color="#0a1230"/>
        <stop offset="1" stop-color="#04060f"/>
      </linearGradient>

      <!-- Tiny rim light from the upper-left to give the body depth. -->
      <radialGradient id="rim" cx="220" cy="200" r="900" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="rgba(99,160,255,0.35)"/>
        <stop offset="0.5" stop-color="rgba(99,160,255,0.05)"/>
        <stop offset="1" stop-color="rgba(99,160,255,0)"/>
      </radialGradient>

      <!-- Back-panel fill: subtle teal-on-dark. -->
      <linearGradient id="back" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="rgba(56,189,248,0.35)"/>
        <stop offset="1" stop-color="rgba(56,189,248,0.10)"/>
      </linearGradient>

      <!-- Front panel fill: deep teal -> bright cyan. -->
      <linearGradient id="front" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#22d3ee"/>
        <stop offset="0.55" stop-color="#06b6d4"/>
        <stop offset="1" stop-color="#0e7490"/>
      </linearGradient>

      <!-- Front-panel "screen" inner gradient (the display area). -->
      <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#0c2436"/>
        <stop offset="1" stop-color="#020617"/>
      </linearGradient>

      <!-- Rounded square clip. -->
      <clipPath id="clip">
        <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
      </clipPath>

      <!-- Outer drop shadow filter. -->
      <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
        <feOffset dx="0" dy="14" result="offsetBlur"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
        <feMerge>
          <feMergeNode/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g filter="url(#dropshadow)">
      <g clip-path="url(#clip)">
        <!-- Body. -->
        <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
        <rect x="0" y="0" width="1024" height="1024" fill="url(#rim)"/>

        <!-- Faint starfield dots. -->
        <g fill="rgba(255,255,255,0.6)">
          <circle cx="120" cy="180" r="2.5"/>
          <circle cx="180" cy="120" r="1.5"/>
          <circle cx="260" cy="220" r="1.2"/>
          <circle cx="800" cy="160" r="1.8"/>
          <circle cx="860" cy="220" r="1.4"/>
          <circle cx="740" cy="110" r="1.2"/>
          <circle cx="930" cy="320" r="1.5"/>
          <circle cx="80"  cy="380" r="1.2"/>
          <circle cx="140" cy="900" r="1.4"/>
          <circle cx="880" cy="880" r="2"/>
          <circle cx="940" cy="940" r="1.2"/>
          <circle cx="60"  cy="940" r="1.5"/>
        </g>

        <!-- Back panel: tilted, faint, just a silhouette of a second monitor. -->
        <g transform="translate(512 470) rotate(-9)">
          <rect x="-260" y="-170" width="520" height="340" rx="34" ry="34" fill="url(#back)" stroke="rgba(125,211,252,0.45)" stroke-width="4"/>
        </g>

        <!-- Cast-signal arcs (3 progressively fainter). -->
        <g transform="translate(770 480) rotate(-9)" fill="none" stroke="rgba(125,211,252,0.9)" stroke-width="9" stroke-linecap="round">
          <path d="M 0 -130 A 130 130 0 0 1 0 130"/>
          <path d="M 0 -185 A 185 185 0 0 1 0 185" stroke="rgba(125,211,252,0.55)"/>
          <path d="M 0 -240 A 240 240 0 0 1 0 240" stroke="rgba(125,211,252,0.30)"/>
        </g>

        <!-- Front panel (the visible monitor). -->
        <g transform="translate(512 640)">
          <!-- Outer frame: solid teal rounded rectangle. -->
          <rect x="-300" y="-210" width="600" height="420" rx="44" ry="44" fill="url(#front)" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

          <!-- Inner display area: dark "screen" with content. -->
          <rect x="-270" y="-180" width="540" height="340" rx="22" ry="22" fill="url(#screen)"/>

          <!-- Display content: an abstract chart (rising bars + line) on a faint grid. -->
          <g opacity="0.18" stroke="rgba(125,211,252,1)" stroke-width="1">
            <line x1="-240" y1="-100" x2="240" y2="-100"/>
            <line x1="-240" y1="-40"  x2="240" y2="-40"/>
            <line x1="-240" y1="20"   x2="240" y2="20"/>
            <line x1="-240" y1="80"   x2="240" y2="80"/>
            <line x1="-160" y1="-150" x2="-160" y2="120"/>
            <line x1="-80"  y1="-150" x2="-80"  y2="120"/>
            <line x1="0"    y1="-150" x2="0"    y2="120"/>
            <line x1="80"   y1="-150" x2="80"   y2="120"/>
            <line x1="160"  y1="-150" x2="160"  y2="120"/>
          </g>

          <!-- The signature mirror line: a sine-like wave in cyan. -->
          <g fill="none" stroke="url(#front)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
            <path d="M -210 30
                     C -130 -40, -70 100, 0 30
                     S 130 -50, 210 30"/>
          </g>
          <!-- Mirror reflection: a faded copy below the line, scaled vertically. -->
          <g fill="none" stroke="rgba(34,211,238,0.45)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="scale(1 -0.4)">
            <path d="M -210 30
                     C -130 -40, -70 100, 0 30
                     S 130 -50, 210 30"/>
          </g>

          <!-- Three "frame dots" in the top-left of the display: live indicator. -->
          <circle cx="-235" cy="-150" r="7" fill="#22d3ee"/>
          <circle cx="-210" cy="-150" r="7" fill="rgba(34,211,238,0.6)"/>
          <circle cx="-185" cy="-150" r="7" fill="rgba(34,211,238,0.3)"/>

          <!-- Monitor stand: neck + base. -->
          <rect x="-26" y="208" width="52" height="36" fill="rgba(8,145,178,0.85)"/>
          <rect x="-160" y="240" width="320" height="18" rx="9" ry="9" fill="rgba(8,145,178,0.85)"/>
        </g>

        <!-- Subtle inner glass edge. -->
        <rect x="3" y="3" width="1018" height="1018" rx="218" ry="218" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>
      </g>
    </g>
  </svg>
</body>
</html>
