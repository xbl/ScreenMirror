<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Screenmirror Icon Generator</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: transparent;
    }
    .stage {
      display: block;
    }
  </style>
</head>
<body>
  <svg id="icon-source" class="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <g id="app-icon">
      <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="#000000" />
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="390" y="304" width="360" height="274" rx="58" ry="58" stroke="#ffffff" stroke-width="54" />
        <rect x="274" y="438" width="360" height="274" rx="58" ry="58" stroke="#ffffff" stroke-width="54" />
        <path d="M 634 574 L 700 574" stroke="#20d6b5" stroke-width="54" />
      </g>
    </g>
    <g id="tray-disconnected">
      <rect x="380" y="246" width="414" height="326" rx="68" ry="68" fill="none" stroke="#000000" stroke-width="76" />
      <rect x="230" y="434" width="414" height="326" rx="68" ry="68" fill="none" stroke="#000000" stroke-width="76" />
    </g>
    <g id="tray-connected">
      <rect x="380" y="246" width="414" height="326" rx="68" ry="68" fill="none" stroke="#000000" stroke-width="76" />
      <rect x="230" y="434" width="414" height="326" rx="68" ry="68" fill="none" stroke="#000000" stroke-width="76" />
      <!-- Short connection bar bridging the two screens at their vertical
           overlap (y=503 is the midpoint of the overlap region y 434..572).
           It crosses the inner edge of screen 1's left stroke and screen 2's
           right stroke, intentionally unifying with them so the eye reads
           "two screens joined by a link". 350 units long, 110 thick, which
           keeps the bar clearly visible at 44px (≈22pt menu bar) without
           erasing the dual-screen silhouette. -->
      <path d="M 320 503 L 670 503" fill="none" stroke="#000000" stroke-width="110" stroke-linecap="round" />
    </g>
  </svg>
</body>
</html>
