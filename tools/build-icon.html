<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScreenMirror Icon Generator</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: transparent;
    }
    .stage {
      display: block;
    }
  </style>
</head>
<body>
  <svg id="icon-source" class="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
      <clipPath id="app-clip">
        <rect x="32" y="32" width="960" height="960" rx="216" />
      </clipPath>
      <clipPath id="tray-clip">
        <rect x="16" y="16" width="992" height="992" rx="48" />
      </clipPath>
      <mask id="tray-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
        <rect width="1024" height="1024" fill="#000" />
        <g transform="translate(64 0)">
          <image href="assets/tray-icon-source.png" x="-643" y="-399" width="1870" height="1570" preserveAspectRatio="none" />
          <rect x="0" y="0" width="8" height="760" fill="#000" />
          <rect x="852" y="0" width="172" height="528" fill="#000" />
          <rect x="820" y="503" width="184" height="140" fill="#000" />
        </g>
      </mask>
    </defs>
    <g id="app-icon">
      <image href="assets/app-icon-source.png" x="32" y="32" width="960" height="960" preserveAspectRatio="xMidYMid slice" clip-path="url(#app-clip)" />
    </g>
    <g id="tray-disconnected" clip-path="url(#tray-clip)">
      <rect width="1024" height="1024" fill="#000" mask="url(#tray-mask)" />
    </g>
    <g id="tray-connected" clip-path="url(#tray-clip)" opacity=".996">
      <rect width="1024" height="1024" fill="#000" mask="url(#tray-mask)" />
    </g>
  </svg>
</body>
</html>
