[package]
name = "screenmirror"
version = "0.1.0"
edition = "2021"
description = "Screen sharing via WebRTC"
authors = ["screenmirror"]
default-run = "screenmirror"

[lib]
name = "screenmirror_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
str0m = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
clap = { version = "4.5", features = ["derive"] }
parking_lot = "0.12"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
once_cell = "1.19"
if-addrs = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
xcap = "0.9"

[dev-dependencies]
tokio-tungstenite = "0.21"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "screenmirror-server"
path = "src/bin/screenmirror-server.rs"
